# GRPO-MoE 실험 설정

# Data
data:
  data_dir: "ml-100k"
  train_rating_path: "ml-100k/u1.base"
  val_rating_path: "ml-100k/u1.test"
  max_length: 10

# Model
model:
  embedding_dim: 64
  num_experts: 8
  expert_hidden_dim: 256
  policy_hidden_dim: 128
  clip_epsilon: 0.2
  temperature: 1.0
  dropout: 0.1

# GRPO Training
grpo:
  batch_size: 256
  grpo_epochs: 4
  entropy_coef: 0.01
  baseline_coef: 0.5
  max_grad_norm: 0.5

# Training
training:
  epochs: 100
  lr: 0.0003
  weight_decay: 0.00001
  patience: 15

# Misc
misc:
  seed: 42
  checkpoint_dir: "checkpoints/grpo_moe"

# Description
description: "GRPO-based reinforcement learning MoE model with group relative rewards"
